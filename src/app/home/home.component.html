<div class="courses-panel">
  <h3>All Courses:</h3>

  <button
    class="btn"
    (click)="onAddCourse()"
  >
    Add Course
  </button>
  <mat-tab-group>
    <mat-tab label="Beginners">
      <courses-card-list
        [courses]="beginnerCourses()"
        (outputedCourse)="onOutputedCourse($event)"
        (deletedCourse)="onCourseDeleted($event)"
        #beginnersList
      ></courses-card-list>
    </mat-tab>

    <mat-tab label="Advanced">
      <courses-card-list
        [courses]="advancedCourses()"
        (outputedCourse)="onOutputedCourse($event)"
      ></courses-card-list>
    </mat-tab>
  </mat-tab-group>
</div>
