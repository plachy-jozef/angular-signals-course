<div class="course-container">
  <div class="course-header">
    <h1>{{ course()?.title }}</h1>
    <img
      alt="course"
      class="course-image"
      [src]="course()?.iconUrl"
    />

    <div class="table-content">
      <table class="result-table">
        @for(lesson of lessons(); track lesson.id) {
        <tr>
          <td>{{ lesson.description }}</td>
          <td>{{ lesson.duration }}</td>
        </tr>
        }
      </table>
    </div>
  </div>
</div>
