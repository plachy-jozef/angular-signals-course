<div class="form-control">

  <!-- content projection -->
  <ng-content select=".title"></ng-content>

    #category
    [value]="value()"
    (change)="onCategoryChange(category.value)"

    <option value="INTERMEDIATE">Intermediate</option>
    <option value="ADVANCED">Advanced</option>
  </select>
</div>
